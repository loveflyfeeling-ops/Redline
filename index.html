<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="紅線合緣診斷：輸入男女雙方生日、時辰與血型，從八字、生肖、星座、血型、生命靈數九個面向評出情人合緣指數與相處建議。">
<meta property="og:title" content="紅線合緣診斷">
<meta property="og:description" content="男女情人合適度診斷｜八字 × 生肖 × 星座 × 血型 × 生命靈數">
<style>:root{color-scheme:light}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>紅線合緣診斷</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.7/lunar.js"></script>
<style>
/* Layout: 兩張命盤卡片左右並列，中間一條紅線相連；下方為合緣報告（總分環 → 九項分數 → 逐項解析 → 相處建議） */
:root{
  --bg:#f6f2f3; --paper:#fffdfd; --ink:#2b1f25; --muted:#76646c; --line:#e5d9dd;
  --red:#b0142f; --red-soft:#f6dde2; --gold:#a8792b; --he:#2e4f86; --he-soft:#e2e9f5; --she:#b0142f; --she-soft:#f6dde2;
  --good:#2f7a5b; --warn:#b07a12; --bad:#b0142f;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171116; --paper:#221a20; --ink:#f1e7ea; --muted:#ab979f; --line:#3a2d34;
  --red:#ef5a72; --red-soft:#3d1c25; --gold:#d6aa5c; --he:#8fb0ea; --he-soft:#1d2840; --she:#ef5a72; --she-soft:#3d1c25;
  --good:#5fc394; --warn:#e0b04f; --bad:#ef5a72; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171116; --paper:#221a20; --ink:#f1e7ea; --muted:#ab979f; --line:#3a2d34;
  --red:#ef5a72; --red-soft:#3d1c25; --gold:#d6aa5c; --he:#8fb0ea; --he-soft:#1d2840; --she:#ef5a72; --she-soft:#3d1c25;
  --good:#5fc394; --warn:#e0b04f; --bad:#ef5a72; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:24px 64px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(28px,5vw,42px);margin:0;letter-spacing:.06em;line-height:1.2}
h1 span{color:var(--red)}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
nav.tabs{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px}
nav.tabs button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;padding:6px 14px;border-radius:999px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--red);color:#fff}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.pair{display:grid;grid-template-columns:1fr 56px 1fr;align-items:stretch}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.card.he{border-top:4px solid var(--he)} .card.she{border-top:4px solid var(--she)}
.card h2{font-family:var(--f-display);font-size:20px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card.he h2 .dot{background:var(--he)} .card.she h2 .dot{background:var(--she)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.thread{position:relative;display:flex;align-items:center;justify-content:center}
.thread svg{width:56px;height:100%;min-height:120px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.row label.k{width:64px;color:var(--muted);font-size:13px;flex:none}
select,input[type=text]{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
input[type=text]{flex:1;min-width:120px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--bg);color:var(--muted);font:inherit;font-size:13px;padding:5px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chk{font-size:13px;color:var(--muted);display:inline-flex;gap:4px;align-items:center}
.preview{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted)}
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px;text-align:center}
.pillar{border:1px solid var(--line);border-radius:8px;padding:4px 0;background:var(--bg)}
.pillar small{display:block;font-size:11px;color:var(--muted)}
.pillar b{font-family:var(--f-display);font-size:20px;letter-spacing:.1em;color:var(--ink);display:block;line-height:1.3}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:22px 0 8px}
.btn{font:inherit;font-weight:700;border-radius:999px;padding:10px 26px;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.btn.primary{background:var(--red);color:#fff;border-color:var(--red);font-size:16px;padding:12px 36px;letter-spacing:.15em}
.btn.small{padding:6px 14px;font-size:13px;font-weight:500}
.note{font-size:12px;color:var(--muted);text-align:center}

#report{margin-top:28px}
.summary{display:grid;grid-template-columns:240px 1fr;gap:24px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px;align-items:center}
.ring{position:relative;width:200px;height:200px;margin:auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-family:var(--f-display);font-size:54px;line-height:1;font-variant-numeric:tabular-nums}
.ring .num small{color:var(--muted);font-size:12px;letter-spacing:.2em}
.verdict{font-family:var(--f-display);font-size:28px;font-weight:900;margin:0;letter-spacing:.08em}
.couple{color:var(--muted);font-size:14px;margin:2px 0 10px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tag{font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg)}
.tag.g{color:var(--good);border-color:currentColor} .tag.w{color:var(--warn);border-color:currentColor} .tag.b{color:var(--bad);border-color:currentColor}
.bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px 28px;margin-top:20px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px}
.bar{display:grid;grid-template-columns:92px 1fr 36px;gap:10px;align-items:center;font-size:14px}
.bar .track{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar .fill{height:100%;border-radius:4px;background:var(--red)}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.bar .w{font-size:11px;color:var(--muted)}
.sec-title{font-family:var(--f-display);font-size:22px;margin:30px 0 12px;display:flex;align-items:baseline;gap:10px}
.sec-title small{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:400}
.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.item{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.item h3{margin:0 0 4px;font-size:16px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.item h3 .sc{font-variant-numeric:tabular-nums;font-size:14px}
.item .rel{font-family:var(--f-display);font-size:15px;color:var(--gold);margin-bottom:6px}
.item p{margin:0;font-size:14px;color:var(--ink)}
.wx{display:grid;grid-template-columns:auto repeat(5,1fr);gap:4px 6px;font-size:13px;align-items:center;margin:8px 0}
.wx .h{color:var(--muted);text-align:center;font-size:12px}
.wx .c{text-align:center;font-variant-numeric:tabular-nums;border-radius:6px;padding:2px 0;background:var(--bg)}
.wx .c.zero{color:var(--bad);font-weight:700}
.advice{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px}
.advice ul{margin:0;padding-left:1.2em}
.advice li{margin:6px 0}
.lucky{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}
.lucky div{border:1px solid var(--line);border-radius:10px;padding:8px 14px;background:var(--bg);font-size:13px}
.lucky b{display:block;font-family:var(--f-display);font-size:17px}
.sample{display:inline-block;font-size:12px;color:var(--gold);border:1px solid currentColor;border-radius:4px;padding:0 6px;margin-left:6px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px}
.rec{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rec:last-child{border-bottom:0}
.rec .meta{font-size:13px;color:var(--muted)}
.conv-out{margin-top:14px;font-size:16px;font-family:var(--f-display)}
.disclaimer{margin-top:36px;font-size:12px;color:var(--muted);text-align:center}
@media (max-width:760px){
  .pair{grid-template-columns:1fr}
  .thread{height:40px}.thread svg{transform:rotate(90deg);min-height:0;height:56px}
  .summary{grid-template-columns:1fr;text-align:center}.tags{justify-content:center}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.fill,.ringfg{transition:all .8s ease}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div>
      <h1>紅線<span>合緣</span>診斷</h1>
      <p class="sub">男女情人合適度 · 八字 × 生肖 × 星座 × 血型 × 生命靈數 九項綜合評分</p>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="diag">合緣診斷</button>
      <button role="tab" aria-selected="false" data-tab="conv">農曆換算</button>
      <button role="tab" aria-selected="false" data-tab="recs">保存記錄</button>
    </nav>
  </header>

  <section id="tab-diag">
    <div class="pair">
      <div class="card he" id="card-m"></div>
      <div class="thread" aria-hidden="true">
        <svg viewBox="0 0 56 200" preserveAspectRatio="none"><path d="M0 100 C 18 60, 38 140, 56 100" stroke="var(--red)" stroke-width="2.5" fill="none"/><circle cx="28" cy="100" r="5" fill="var(--red)"/></svg>
      </div>
      <div class="card she" id="card-f"></div>
    </div>
    <div class="actions">
      <button class="btn primary" id="go">開始診斷</button>
      <button class="btn" id="save">保存記錄</button>
    </div>
    <p class="note" id="msg">八字以節氣定年月（立春換年），23 點後的晚子時日柱仍算當日。</p>
    <div id="report"></div>
  </section>

  <section id="tab-conv" hidden>
    <div class="panel">
      <h2 style="font-family:var(--f-display);margin-top:0">國曆 ⇄ 農曆換算</h2>
      <div class="row"><label class="k">換算方向</label>
        <div class="seg" id="conv-dir"><button aria-pressed="true" data-v="s2l">國曆→農曆</button><button aria-pressed="false" data-v="l2s">農曆→國曆</button></div></div>
      <div class="row"><label class="k">日期</label>
        <select id="cv-y"></select>年<select id="cv-m"></select>月<select id="cv-d"></select>日
        <label class="chk" id="cv-leap-wrap" hidden><input type="checkbox" id="cv-leap">閏月</label>
        <button class="btn small" id="cv-go">換算</button></div>
      <div class="conv-out" id="cv-out"></div>
    </div>
  </section>

  <section id="tab-recs" hidden>
    <div class="panel"><div id="rec-list"></div></div>
  </section>

  <p class="disclaimer">本診斷依傳統命理與民俗配對規則計算，僅供參考與娛樂。感情的長久，靠的是兩人的溝通與經營。</p>
</div>

<script>
(function(){
const L = window.Solar ? {Solar:window.Solar, Lunar:window.Lunar} : null;
const $ = s=>document.querySelector(s);
const GAN="甲乙丙丁戊己庚辛壬癸", ZHI="子丑寅卯辰巳午未申酉戌亥";
const SX="鼠牛虎兔龍蛇馬羊猴雞狗豬";
const GWX={甲:"木",乙:"木",丙:"火",丁:"火",戊:"土",己:"土",庚:"金",辛:"金",壬:"水",癸:"水"};
const ZWX={子:"水",丑:"土",寅:"木",卯:"木",辰:"土",巳:"火",午:"火",未:"土",申:"金",酉:"金",戌:"土",亥:"水"};
const WX=["木","火","土","金","水"];
const SHENG={木:"火",火:"土",土:"金",金:"水",水:"木"}, KE={木:"土",土:"水",水:"火",火:"金",金:"木"};
const WXCOLOR={木:"綠色、青色",火:"紅色、紫色",土:"黃色、咖啡色",金:"白色、金色",水:"黑色、藍色"};
const WXDIR={木:"東方",火:"南方",土:"中央",金:"西方",水:"北方"};
const WXDATE={木:"植物園、森林步道",火:"看夕陽、燭光晚餐",土:"陶藝、山間小旅行",金:"音樂會、看展",水:"海邊、湖畔散步"};
const LMN=["正","二","三","四","五","六","七","八","九","十","冬","臘"];
const LDN=d=>{const a=["初","十","廿","三"],n=["十","一","二","三","四","五","六","七","八","九"];if(d===10)return"初十";if(d===20)return"二十";if(d===30)return"三十";return a[Math.floor(d/10)]+n[d%10]};

/* ---------- 輸入表單 ---------- */
function opts(a,b,sel,fmt){let h="";for(let i=a;i<=b;i++)h+=`<option value="${i}"${i===sel?" selected":""}>${fmt?fmt(i):i}</option>`;return h}
function buildCard(id,who,def){
  const el=$("#card-"+id), p=id;
  el.innerHTML=`<h2><span class="dot"></span>${who}<span class="sample" id="${p}-sample">範例</span></h2>
  <div class="row"><label class="k" for="${p}-name">姓名</label><input type="text" id="${p}-name" value="${def.name}" placeholder="可不填"></div>
  <div class="row"><label class="k">曆法</label><div class="seg" id="${p}-cal"><button aria-pressed="true" data-v="s">國曆</button><button aria-pressed="false" data-v="l">農曆</button></div>
    <label class="chk" id="${p}-leap-wrap" hidden><input type="checkbox" id="${p}-leap">閏月</label></div>
  <div class="row"><label class="k">出生日期</label><select id="${p}-y">${opts(1921,2060,def.y)}</select>年<select id="${p}-m">${opts(1,12,def.m)}</select>月<select id="${p}-d">${opts(1,31,def.d)}</select>日</div>
  <div class="row"><label class="k">出生時間</label><select id="${p}-h"><option value="-1">不詳</option>${opts(0,23,def.h,i=>String(i).padStart(2,"0"))}</select>時<select id="${p}-mi">${opts(0,59,def.mi,i=>String(i).padStart(2,"0"))}</select>分</div>
  <div class="row"><label class="k" for="${p}-blood">血型</label><select id="${p}-blood"><option value="">不詳</option>${["A","B","AB","O"].map(b=>`<option${b===def.blood?" selected":""}>${b}</option>`).join("")}</select></div>
  <div class="preview" id="${p}-pv"></div>`;
  el.querySelectorAll(`#${p}-cal button`).forEach(b=>b.onclick=()=>{el.querySelectorAll(`#${p}-cal button`).forEach(x=>x.setAttribute("aria-pressed",x===b));$(`#${p}-leap-wrap`).hidden=b.dataset.v!=="l";preview(p)});
  el.addEventListener("input",()=>{$(`#${p}-sample`).hidden=true;preview(p)});
  el.addEventListener("change",()=>{$(`#${p}-sample`).hidden=true;preview(p)});
}
function readForm(p){
  return {name:$(`#${p}-name`).value.trim(),cal:document.querySelector(`#${p}-cal button[aria-pressed="true"]`).dataset.v,leap:$(`#${p}-leap`).checked,
    y:+$(`#${p}-y`).value,m:+$(`#${p}-m`).value,d:+$(`#${p}-d`).value,h:+$(`#${p}-h`).value,mi:+$(`#${p}-mi`).value,blood:$(`#${p}-blood`).value};
}
function writeForm(p,f){
  $(`#${p}-name`).value=f.name||"";$(`#${p}-y`).value=f.y;$(`#${p}-m`).value=f.m;$(`#${p}-d`).value=f.d;$(`#${p}-h`).value=f.h;$(`#${p}-mi`).value=f.mi;$(`#${p}-blood`).value=f.blood||"";
  document.querySelectorAll(`#${p}-cal button`).forEach(x=>x.setAttribute("aria-pressed",x.dataset.v===(f.cal||"s")));
  $(`#${p}-leap-wrap`).hidden=f.cal!=="l";$(`#${p}-leap`).checked=!!f.leap;$(`#${p}-sample`).hidden=true;preview(p);
}

/* ---------- 命盤計算 ---------- */
function chart(f){
  let solar;
  const hh=f.h<0?12:f.h, mm=f.h<0?0:f.mi;
  if(f.cal==="l"){
    let lu;try{lu=L.Lunar.fromYmdHms(f.y,f.leap?-f.m:f.m,f.d,hh,mm,0)}catch(e){throw new Error("這個農曆日期不存在（該年可能沒有這個閏月，或該月只有 29 天）。")}
    solar=lu.getSolar();
    if(f.leap && lu.getMonth()>0) throw new Error(`農曆 ${f.y} 年沒有閏${LMN[f.m-1]}月`);
  }else{
    const t=new Date(f.y,f.m-1,f.d); if(t.getMonth()!==f.m-1) throw new Error(`國曆 ${f.y}/${f.m} 沒有 ${f.d} 日`);
    solar=L.Solar.fromYmdHms(f.y,f.m,f.d,hh,mm,0);
  }
  const lu=solar.getLunar(), ec=lu.getEightChar();
  const P=[ec.getYear(),ec.getMonth(),ec.getDay()]; if(f.h>=0)P.push(ec.getTime());
  const cnt={木:0,火:0,土:0,金:0,水:0}; P.forEach(g=>{cnt[GWX[g[0]]]++;cnt[ZWX[g[1]]]++});
  const lm=lu.getMonth();
  const sy=solar.getYear(), sm=solar.getMonth(), sd=solar.getDay();
  const lp=lifePath(sy,sm,sd);
  return {f,P,cnt,dayGan:P[2][0],dayZhi:P[2][1],yearZhi:P[0][1],sx:SX[ZHI.indexOf(P[0][1])],
    nayin:toTrad(ec.getYearNaYin()), solarStr:`${sy}年${sm}月${sd}日`,
    lunarStr:`農曆 ${P[0]}年 ${lm<0?"閏":""}${LMN[Math.abs(lm)-1]}月${LDN(lu.getDay())}`,
    star:starSign(sm,sd), lp};
}
const T2={"炉":"爐","剑":"劍","头":"頭","涧":"澗","蜡":"蠟","杨":"楊","雳":"靂","长":"長","灯":"燈","驿":"驛","钗":"釵","钏":"釧"};
function toTrad(x){return [...x].map(c=>T2[c]||c).join("")}
function lifePath(y,m,d){let s=String(y)+m+d,n=[...s].reduce((a,c)=>a+ +c,0);while(n>9)n=[...String(n)].reduce((a,c)=>a+ +c,0);return n}
const STARS=[["摩羯",1,19],["水瓶",2,18],["雙魚",3,20],["牡羊",4,19],["金牛",5,20],["雙子",6,21],["巨蟹",7,22],["獅子",8,22],["處女",9,22],["天秤",10,23],["天蠍",11,22],["射手",12,21],["摩羯",12,31]];
function starSign(m,d){for(const [n,mm,dd] of STARS){if(m<mm||(m===mm&&d<=dd))return n}return"摩羯"}
const STAR_ORDER=["牡羊","金牛","雙子","巨蟹","獅子","處女","天秤","天蠍","射手","摩羯","水瓶","雙魚"];
const STAR_EL=["火","土","風","水"];

function preview(p){
  const pv=$(`#${p}-pv`);
  try{const c=chart(readForm(p));
    const labels=["年柱","月柱","日柱","時柱"];
    pv.innerHTML=`${c.solarStr} · ${c.lunarStr} · 生肖${c.sx} · ${c.star}座
    <div class="pillars">${labels.map((l,i)=>`<div class="pillar"><small>${l}</small><b>${c.P[i]||"－"}</b></div>`).join("")}</div>`;

      <p class="couple"><b style="color:var(--he)">${esc(nm)}</b>（${M.solarStr}・屬${M.sx}・${M.star}座${M.f.blood?"・"+M.f.blood+"型":""}）× <b style="color:var(--she)">${esc(nf)}</b>（${F.solarStr}・屬${F.sx}・${F.star}座${F.f.blood?"・"+F.f.blood+"型":""}）</p>
      <p style="margin:0">${vd}</p>
      <div class="tags">${good.map(k=>`<span class="tag g">優勢・${k}</span>`).join("")}${bad.map(k=>`<span class="tag b">留意・${k}</span>`).join("")}</div>
    </div>
  </div>
  <div class="bars">${S.R.map(r=>`<div class="bar"><span>${r.k} <span class="w">×${r.w}</span></span><div class="track"><div class="fill" style="width:${r.s??0}%;background:${r.s==null?"var(--line)":colorOf(r.s)}"></div></div><span class="v">${r.s??"－"}</span></div>`).join("")}</div>
  <h2 class="sec-title">逐項解析 <small>分數 × 權重加總為合緣指數</small></h2>
  <div class="items">${S.R.map(r=>`<div class="item"><h3>${r.k}<span class="sc" style="color:${r.s==null?"var(--muted)":colorOf(r.s)}">${r.s??"－"} 分</span></h3>
    <div class="rel">${r.rel}</div>${r.wx?wxTable():""}<p>${r.t}</p></div>`).join("")}</div>
  <h2 class="sec-title">相處建議</h2>
  <div class="advice"><ul>${tips.map(t=>`<li>${t}</li>`).join("")}</ul>
    <div class="lucky">
      <div>增進感情色<b>${lackAll.map(e=>WXCOLOR[e].split("、")[0]).join("、")}</b></div>
      <div>旺緣方位<b>${lackAll.map(e=>WXDIR[e]).join("、")}</b></div>
      <div>推薦約會<b>${WXDATE[lackAll[0]]}</b></div>
    </div></div>`;
  msg.textContent="診斷完成。可按「保存記錄」存下這組配對。";
  $("#report").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth",block:"start"});
}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c])}

/* ---------- 保存記錄 ---------- */
const KEY="hongxian-records";
function loadRecs(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return[]}}
function saveRecs(a){try{localStorage.setItem(KEY,JSON.stringify(a));return true}catch(e){return false}}
let pendingDel=null;
function renderRecs(){
  const a=loadRecs(), el=$("#rec-list");
  if(!a.length){el.innerHTML=`<p style="margin:0;color:var(--muted)">還沒有保存的配對。完成診斷後按「保存記錄」，就能在這裡快速載入。記錄只存在這台裝置的瀏覽器中。</p>`;return}
  el.innerHTML=a.map((r,i)=>`<div class="rec"><div><b>${esc(r.m.name||"男方")} × ${esc(r.f.name||"女方")}</b>${r.total!=null?` <span class="tag ${cls(r.total)}">${r.total} 分</span>`:""}
    <div class="meta">${r.m.cal==="l"?"農":"國"} ${r.m.y}/${r.m.m}/${r.m.d} · ${r.f.cal==="l"?"農":"國"} ${r.f.y}/${r.f.m}/${r.f.d} · 存於 ${r.at}</div></div>
    <div style="display:flex;gap:6px"><button class="btn small" data-load="${i}">載入診斷</button>
    <button class="btn small" data-del="${i}" style="${pendingDel===i?"color:#fff;background:var(--bad);border-color:var(--bad)":""}">${pendingDel===i?"確定刪除":"刪除"}</button></div></div>`).join("");
}
$("#rec-list").addEventListener("click",e=>{
  const l=e.target.dataset.load, d=e.target.dataset.del;
  if(l!=null){const r=loadRecs()[+l];writeForm("m",r.m);writeForm("f",r.f);showTab("diag");run();}
  if(d!=null){if(pendingDel===+d){const a=loadRecs();a.splice(+d,1);saveRecs(a);pendingDel=null}else pendingDel=+d;renderRecs();}
});
$("#save").onclick=()=>{
  const m=readForm("m"),f=readForm("f");
  try{chart(m);chart(f)}catch(e){$("#msg").textContent=e.message;return}
  const a=loadRecs(); const now=new Date();
  a.unshift({m,f,total:last&&JSON.stringify(last.m)===JSON.stringify(m)&&JSON.stringify(last.f)===JSON.stringify(f)?last.total:null,at:`${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()}`});
  $("#msg").textContent=saveRecs(a.slice(0,50))?`已保存「${m.name||"男方"} × ${f.name||"女方"}」，可到「保存記錄」查看。`:"這個瀏覽器不允許儲存資料，無法保存記錄。";
};

/* ---------- 分頁 ---------- */
function showTab(t){document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));
  ["diag","conv","recs"].forEach(k=>$("#tab-"+k).hidden=k!==t); if(t==="recs"){pendingDel=null;renderRecs()}}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>showTab(b.dataset.tab));

/* ---------- 農曆換算 ---------- */
$("#cv-y").innerHTML=opts(1921,2060,2026);$("#cv-m").innerHTML=opts(1,12,10);$("#cv-d").innerHTML=opts(1,31,12);
let dir="s2l";
document.querySelectorAll("#conv-dir button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#conv-dir button").forEach(x=>x.setAttribute("aria-pressed",x===b));dir=b.dataset.v;$("#cv-leap-wrap").hidden=dir!=="l2s";$("#cv-out").textContent=""});
$("#cv-go").onclick=()=>{
  const y=+$("#cv-y").value,m=+$("#cv-m").value,d=+$("#cv-d").value,out=$("#cv-out");
  if(!L){out.textContent="曆法程式庫載入失敗，請重新整理頁面。";return}
  try{
    if(dir==="s2l"){const t=new Date(y,m-1,d);if(t.getMonth()!==m-1)throw new Error(`國曆 ${y}/${m} 沒有 ${d} 日`);
      const lu=L.Solar.fromYmd(y,m,d).getLunar(),lm=lu.getMonth();
      out.innerHTML=`國曆 ${y}年${m}月${d}日 ＝ 農曆 ${lu.getYearInGanZhi()}年（屬${SX[ZHI.indexOf(lu.getYearZhi())]}） ${lm<0?"閏":""}${LMN[Math.abs(lm)-1]}月${LDN(lu.getDay())}`;}
    else{const leap=$("#cv-leap").checked,lu=L.Lunar.fromYmd(y,leap?-m:m,d);
      if(leap&&lu.getMonth()>0)throw new Error(`農曆 ${y} 年沒有閏${LMN[m-1]}月`);
      const s=lu.getSolar();out.innerHTML=`農曆 ${y}年 ${leap?"閏":""}${LMN[m-1]}月${LDN(d)} ＝ 國曆 ${s.getYear()}年${s.getMonth()}月${s.getDay()}日（星期${"日一二三四五六"[s.getWeek()]}）`;}
  }catch(e){out.textContent=/[\u4e00-\u9fff]/.test(e.message)?e.message:"這個農曆日期不存在（該年可能沒有這個閏月，或該月只有 29 天）。"}
};

/* ---------- 初始化（範例資料） ---------- */
buildCard("m","男生",{name:"王志明",y:1992,m:3,d:15,h:9,mi:30,blood:"O"});
buildCard("f","女生",{name:"林雅婷",y:1994,m:8,d:22,h:20,mi:10,blood:"A"});
$("#go").onclick=run;
if(L){preview("m");preview("f");run();window.scrollTo(0,0)}else $("#msg").textContent="曆法程式庫載入失敗，請重新整理頁面。";
})();
</script>
